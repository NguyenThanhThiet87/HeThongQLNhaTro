syntax = "proto3";

option csharp_namespace = "Shared.Integration.Protos";

package property;

service RoomService {
  rpc CheckRoomAvailability (RoomRequest) returns (RoomAvailabilityResponse);
}

message RoomRequest {
  int32 room_id = 1;
}

message RoomAvailabilityResponse {
  bool is_available = 1;
  double price = 2;
}
