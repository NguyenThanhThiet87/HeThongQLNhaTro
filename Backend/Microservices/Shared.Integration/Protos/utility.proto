syntax = "proto3";

option csharp_namespace = "Shared.Integration.Protos";

package utility;

service UtilityIndexService {
  rpc GetUtilityIndex (UtilityIndexRequest) returns (UtilityIndexResponse);
  rpc RecordUtilityIndex (RecordUtilityIndexRequest) returns (RecordUtilityIndexResponse);
}

message UtilityIndexRequest {
  int32 room_id = 1;
  int32 month = 2;
  int32 year = 3;
}

message UtilityIndexResponse {
  bool exists = 1;
  int32 electricity_old = 2;
  int32 electricity_new = 3;
  int32 water_old = 4;
  int32 water_new = 5;
}

message RecordUtilityIndexRequest {
  int32 room_id = 1;
  int32 month = 2;
  int32 year = 3;
  int32 electricity_old = 4;
  int32 electricity_new = 5;
  int32 water_old = 6;
  int32 water_new = 7;
}

message RecordUtilityIndexResponse {
  bool success = 1;
  string message = 2;
  int32 utility_index_id = 3;
}
