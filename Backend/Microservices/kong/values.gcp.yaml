# Helm values for Kong Gateway OSS on the kong-gateway GKE Autopilot cluster.
# The proxy remains private; an External Application Load Balancer will be the
# only public entry point in a later step.
env:
  database: "off"
  # GKE Autopilot pods do not expose the IPv6 loopback address used by the
  # chart default. Keep the Admin API reachable only inside the pod via IPv4.
  admin_listen: "127.0.0.1:8444 http2 ssl"

ingressController:
  enabled: false

replicaCount: 2

dblessConfig:
  configMap: kong-gcp-config

proxy:
  type: ClusterIP

admin:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1
