_format_version: "3.0"
_transform: true

# Render production gateway configuration.
# Kong routes incoming public traffic to the 7 Render microservices via HTTPS.
services:
  - name: health-service
    url: http://127.0.0.1:8001/status
    routes:
      - name: health-route
        paths: [ / ]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          message: "Kong Gateway is running"

  - name: identity-service
    url: https://identity-service-wqgy.onrender.com
    routes:
      - name: identity-route
        paths: [ /api/NguoiDung ]
        strip_path: false

  - name: property-service
    url: https://property-service-tfz1.onrender.com
    routes:
      - name: property-route
        paths: [ /api/PhongNhaTro ]
        strip_path: false

  - name: contract-service
    url: https://contract-service-xi3h.onrender.com
    routes:
      - name: contract-route
        paths: [ /api/HopDong ]
        strip_path: false

  - name: utility-service
    url: https://utility-service-x4fg.onrender.com
    routes:
      - name: utility-route
        paths: [ /api/DichVu ]
        strip_path: false

  - name: billing-service
    url: https://billing-service-hkb4.onrender.com
    routes:
      - name: billing-route
        paths: [ /api/HoaDonThanhToan, /api/DichVuDonHang, /api/PayOS, /api/VNPay, /chathub ]
        strip_path: false

  - name: maintenance-service
    url: https://maintenance-service-tbm5.onrender.com
    routes:
      - name: maintenance-route
        paths: [ /api/SuCoBaoTri ]
        strip_path: false

  - name: communication-service
    url: https://communication-service-ed8m.onrender.com
    routes:
      - name: communication-route
        paths: [ /api/ThongBao ]
        strip_path: false

plugins:
  - name: cors
    config:
      origins: [ "*" ]
      methods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
      headers: [ Accept, Accept-Version, Content-Length, Content-MD5, Content-Type, Date, Authorization, X-Request-ID ]
      exposed_headers: [ X-Request-ID ]
      credentials: true
      max_age: 3600
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
