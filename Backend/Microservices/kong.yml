_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://host.docker.internal:5001
    routes:
      - name: identity-route
        paths:
          - /api/NguoiDung
        strip_path: false

  - name: property-service
    url: http://host.docker.internal:5002
    routes:
      - name: property-route
        paths:
          - /api/PhongNhaTro
        strip_path: false

  - name: contract-service
    url: http://host.docker.internal:5003
    routes:
      - name: contract-route
        paths:
          - /api/HopDong
        strip_path: false

  - name: utility-service
    url: http://host.docker.internal:5004
    routes:
      - name: utility-route
        paths:
          - /api/DichVu
        strip_path: false

  - name: billing-service
    url: http://host.docker.internal:5005
    routes:
      - name: billing-route
        paths:
          - /api/HoaDonThanhToan
          - /api/DichVuDonHang
          - /api/PayOS
          - /api/VNPay
          - /chathub
        strip_path: false

  - name: maintenance-service
    url: http://host.docker.internal:5006
    routes:
      - name: maintenance-route
        paths:
          - /api/SuCoBaoTri
        strip_path: false

  - name: communication-service
    url: http://host.docker.internal:5007
    routes:
      - name: communication-route
        paths:
          - /api/ThongBao
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - PATCH
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
      credentials: true
      max_age: 3600
