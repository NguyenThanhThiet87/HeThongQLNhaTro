services:
  # ============================================================================
  # 1. KONG API GATEWAY (Public Web Service)
  # ============================================================================
  - type: web
    name: kong-gateway
    env: docker
    dockerfilePath: ./Backend/Microservices/kong/Dockerfile.render
    dockerContext: ./Backend/Microservices/kong
    region: singapore
    plan: free
    envVars:
      - key: KONG_DATABASE
        value: "off"

  # ============================================================================
  # 2. IDENTITY MICROSERVICE (Web Service)
  # ============================================================================
  - type: web
    name: identity-service
    env: docker
    dockerfilePath: ./Backend/Microservices/Dockerfile
    dockerContext: ./Backend/Microservices
    region: singapore
    plan: free
    envVars:
      - key: SERVICE
        value: IdentityService
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: MyApp
      - key: Jwt__Audience
        value: MyAppUser
      - key: RabbitMq__Host
        sync: false
      - key: RabbitMq__Username
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__VirtualHost
        sync: false
      - key: CloudinarySettings__CloudName
        sync: false
      - key: CloudinarySettings__ApiKey
        sync: false
      - key: CloudinarySettings__ApiSecret
        sync: false

  # ============================================================================
  # 3. PROPERTY MICROSERVICE (Web Service)
  # ============================================================================
  - type: web
    name: property-service
    env: docker
    dockerfilePath: ./Backend/Microservices/Dockerfile
    dockerContext: ./Backend/Microservices
    region: singapore
    plan: free
    envVars:
      - key: SERVICE
        value: PropertyService
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: MyApp
      - key: Jwt__Audience
        value: MyAppUser
      - key: RabbitMq__Host
        sync: false
      - key: RabbitMq__Username
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__VirtualHost
        sync: false
      - key: CloudinarySettings__CloudName
        sync: false
      - key: CloudinarySettings__ApiKey
        sync: false
      - key: CloudinarySettings__ApiSecret
        sync: false

  # ============================================================================
  # 4. CONTRACT MICROSERVICE (Web Service)
  # ============================================================================
  - type: web
    name: contract-service
    env: docker
    dockerfilePath: ./Backend/Microservices/Dockerfile
    dockerContext: ./Backend/Microservices
    region: singapore
    plan: free
    envVars:
      - key: SERVICE
        value: ContractService
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: RabbitMq__Host
        sync: false
      - key: RabbitMq__Username
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__VirtualHost
        sync: false
      - key: Services__IdentityGrpcUrl
        value: http://identity-service:8080
      - key: Services__PropertyGrpcUrl
        value: http://property-service:8080

  # ============================================================================
  # 5. UTILITY MICROSERVICE (Web Service)
