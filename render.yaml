services:
  # ============================================================================
  # 1. KONG API GATEWAY (Public Web Service)
  # ============================================================================
  - type: web
    name: kong-gateway
    runtime: docker
    dockerfilePath: ./Backend/Microservices/kong/Dockerfile.render
    dockerContext: ./Backend/Microservices/kong
    region: singapore
    plan: free
    envVars:
      - key: KONG_DATABASE
        value: "off"
      - key: PORT
        value: "10000"
      - key: KONG_PROXY_LISTEN
        value: "0.0.0.0:10000, 0.0.0.0:8000"
      - key: IDENTITY_SERVICE_URL
        sync: false
      - key: PROPERTY_SERVICE_URL
        sync: false
      - key: CONTRACT_SERVICE_URL
        sync: false
      - key: UTILITY_SERVICE_URL
        sync: false
      - key: BILLING_SERVICE_URL
        sync: false
      - key: MAINTENANCE_SERVICE_URL
        sync: false
      - key: COMMUNICATION_SERVICE_URL
        sync: false

  # ============================================================================
  # 2. IDENTITY MICROSERVICE (Web Service)
  # ============================================================================
  - type: web
    name: identity-service
    runtime: docker
    dockerfilePath: ./Backend/Microservices/Dockerfile
    dockerContext: ./Backend/Microservices
    region: singapore
    plan: free
    envVars:
      - key: SERVICE
        value: IdentityService
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: MyApp
      - key: Jwt__Audience
        value: MyAppUser
      - key: RabbitMq__Host
        sync: false
      - key: RabbitMq__Username
        sync: false
      - key: RabbitMq__Password
        sync: false
      - key: RabbitMq__VirtualHost
        sync: false
      - key: CloudinarySettings__CloudName
        sync: false
      - key: CloudinarySettings__ApiKey
        sync: false
      - key: CloudinarySettings__ApiSecret
        sync: false

